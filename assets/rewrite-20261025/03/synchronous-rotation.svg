<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
<title id="title">月球的同步自转</title>
<desc id="desc">月球沿逆时针方向绕地球运动，四个位置上相同月面地标始终朝向地球。各月球周围的逆时针短弧表示自转方向。</desc>
<!-- Original SVG source. Four positions on a radius-240 circular orbit.
     The same surface pattern is rotated -90 degrees for each quarter orbit.
     Distances and body radii are schematic. -->
<defs>
<marker id="orbit-arrow" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#3b7d92"/></marker>
<marker id="spin-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#b06532"/></marker>
<g id="moon">
<circle r="40" fill="#e0e2df" stroke="#7e8b8d" stroke-width="1.6"/>
<path d="M-30 -9C-37 -3 -33 10 -25 15C-18 20 -14 12 -17 4C-13 -6 -22 -15 -30 -9Z" fill="#a87147"/>
<circle cx="8" cy="-20" r="7" fill="#c2c9c7"/><circle cx="18" cy="14" r="10" fill="#c2c9c7"/>
<circle cx="-1" cy="22" r="4" fill="#c2c9c7"/>
</g>
</defs>
<rect width="760" height="760" fill="#fbfaf6"/>
<circle cx="380" cy="380" r="240" fill="none" stroke="#9bb4bd" stroke-width="1.6" stroke-dasharray="5 7"/>
<g fill="none" stroke="#3b7d92" stroke-width="2.4" marker-end="url(#orbit-arrow)">
<path d="M605.53 297.92A240 240 0 0 0 462.08 154.47"/>
<path d="M297.92 154.47A240 240 0 0 0 154.47 297.92"/>
<path d="M154.47 462.08A240 240 0 0 0 297.92 605.53"/>
<path d="M462.08 605.53A240 240 0 0 0 605.53 462.08"/>
</g>
<g stroke="#bdcbd0" stroke-width="1" stroke-dasharray="3 6"><path d="M425 380H577M380 335V183M335 380H183M380 425V577"/></g>
<circle cx="380" cy="380" r="47" fill="#377e9a"/>
<path d="M359 343L371 349L367 361L381 369L374 387L361 392L354 378L342 373L340 358Z M397 391L412 395L416 406L402 419L389 411Z" fill="#91b4a1"/>
<use href="#moon" transform="translate(620 380)"/>
<use href="#moon" transform="translate(380 140) rotate(-90)"/>
<use href="#moon" transform="translate(140 380) rotate(-180)"/>
<use href="#moon" transform="translate(380 620) rotate(-270)"/>
<g fill="none" stroke="#b06532" stroke-width="2" marker-end="url(#spin-arrow)">
<path d="M670 405A56 56 0 0 0 645 330"/>
<path d="M430 165A56 56 0 0 0 405 90"/>
<path d="M190 405A56 56 0 0 0 165 330"/>
<path d="M430 645A56 56 0 0 0 405 570"/>
</g>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#20343e">
<text x="380" y="457" text-anchor="middle">地球</text>
<text x="620" y="451" text-anchor="middle">月球</text>
</g>
</svg>
